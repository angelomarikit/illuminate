<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Illuminate Medical Aesthetics</title>
    <meta
      name="description"
      content="Illuminate Medical Aesthetics — doctor-led beauty and wellness. Reserve your private session online."
    />
    <meta
      name="keywords"
      content="Illuminate Medical Aesthetics, aesthetic clinic, facial, laser, Bacolod, beauty clinic"
    />

    <!-- Open Graph / Facebook / LinkedIn / Messenger / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Illuminate Medical Aesthetics" />
    <meta property="og:title" content="Illuminate Medical Aesthetics" />
    <meta
      property="og:description"
      content="Let beauty flow in your veins. Doctor-led care, by appointment — reserve your private session."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:secure_url" content="%OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Illuminate Medical Aesthetics clinic" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Illuminate Medical Aesthetics" />
    <meta
      name="twitter:description"
      content="Let beauty flow in your veins. Doctor-led care, by appointment — reserve your private session."
    />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="Illuminate Medical Aesthetics clinic" />

    <!-- Generic social / link preview fallback -->
    <link rel="image_src" href="%OG_IMAGE%" />
    <meta name="thumbnail" content="%OG_IMAGE%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
